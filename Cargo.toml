[workspace]
resolver = "2"
members = [
    "src",
]

[workspace.package]
authors = ["Atlas Sphere Team"]
edition = "2021"
repository = "https://github.com/Cyptopimpinainteazy/atlas-sphere-"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

[profile.release]
opt-level = 3
